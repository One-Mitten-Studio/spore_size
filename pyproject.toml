[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spore-size"
version = "0.1.0"
description = "Automated fungal spore sizing from micrographs with an ocular-micrometer scale bar"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Douglas Smith" }]
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
    "matplotlib",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials"]
dev = ["pytest", "black", "ruff", "mypy", "scipy-stubs"]

[project.scripts]
spore-size = "spore_size.cli:main"
spore-measure = "spore_size.manual:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY", "SIM", "D", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["spore_size"]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
mypy_path = "tests"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "spore_size.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
