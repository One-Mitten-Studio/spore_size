[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spore-size"
version = "0.1.0"
description = "Automated fungal spore sizing from micrographs with an ocular-micrometer scale bar"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Douglas Smith" }]
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[project.scripts]
spore-size = "spore_size.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["spore_size"]
known-local-folder = ["conftest"]
